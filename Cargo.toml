[package]
name = "rustshark"
version = "0.1.0"
edition = "2024"

[lib]
name = "rustshark"
path = "src/lib.rs"

[[bin]]
name = "rustshark"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
etherparse = "0.21.0"
pcap-file = "2.0.0"
quick-xml = "0.42.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
